name: Validar escenarios
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validación estática
        run: ./scripts/validate.sh
      - name: Pruebas dinámicas
        run: sudo ./scripts/smoke-test.sh
      - name: Pruebas dinámicas AIRMUR 06
        run: ./scripts/smoke-test-ra6.sh
